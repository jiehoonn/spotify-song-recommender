<!-- home.html -->
<h1>Song List</h1>
<ul>
    {% for song in songs %}
    <li>
        {{ song.spotify_title }} by {{ song.spotify_artist }}
        <a href="{{ url_for('recommend', song_id=song.id) }}">Recommend</a>
    </li>
    {% endfor %}
</ul>
<div>
    {% if page > 1 %}
    <a href="{{ url_for('home', page=page-1) }}">Previous</a>
    {% endif %}
    {% if page * songs_per_page < total_songs %} <a href="{{ url_for('home', page=page+1) }}">Next</a>
        {% endif %}
</div>
